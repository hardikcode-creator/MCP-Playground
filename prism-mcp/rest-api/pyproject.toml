[project]
name = "prism-rest-api"
version = "1.0.0"
description = "Read-only REST API over collected Nutanix Prism SQLite databases; powers the Prism MCP server."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

# Run directly (uv run python rest_server.py); do not build/install as a package.
[tool.uv]
package = false
